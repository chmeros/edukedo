<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edukedo — Eltern-Passwort setzen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system.css">
</head>
<body>
  <div class="shell shell--narrow">
    <div class="card">
      <a class="brand" href="01-landing-und-app-vorschau.html">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" fill="#fff"/><path d="M6.5 10v4.2c0 1.6 2.46 3.3 5.5 3.3s5.5-1.7 5.5-3.3V10" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        edukedo — Eltern-Dashboard
      </a>

      <p>Bevor du das Eltern-Dashboard nutzen kannst, setze bitte ein eigenes Passwort für den Login.</p>

      <div class="field">
        <label for="pw1">Neues Passwort</label>
        <input class="input" type="password" id="pw1" name="password">
      </div>

      <div class="field">
        <label for="pw2">Passwort wiederholen</label>
        <input class="input" type="password" id="pw2" name="password_repeat">
      </div>

      <button class="btn btn-primary btn-block" type="button">Passwort setzen</button>
    </div>
  </div>
</body>
</html>
