<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edukedo — Registrieren (unter 16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="system.css">
</head>
<body>
  <div class="shell shell--narrow">
    <div class="card">
      <a class="brand" href="01-landing-und-app-vorschau.html">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z" fill="#fff"/><path d="M6.5 10v4.2c0 1.6 2.46 3.3 5.5 3.3s5.5-1.7 5.5-3.3V10" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        edukedo
      </a>

      <div class="segmented">
        <a href="04-login-formular.html">Login</a>
        <a href="05-registrieren-formular.html" class="is-active">Registrieren</a>
      </div>

      <div class="field">
        <label for="reg-email">E-Mail</label>
        <input class="input" type="email" id="reg-email" name="email" placeholder="du@beispiel.de">
      </div>

      <div class="field">
        <label for="reg-pw">Passwort</label>
        <input class="input" type="password" id="reg-pw" name="password">
      </div>

      <div class="field">
        <label for="reg-bday">Geburtsdatum</label>
        <input class="input is-correct" type="date" id="reg-bday" name="birthdate" value="2013-01-01">
      </div>

      <div class="alert alert-info">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6v6c0 5 3.8 8.7 9 10 5.2-1.3 9-5 9-10V6l-9-4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div>Du bist unter 16 — ein Elternteil muss die Einwilligung per E-Mail bestätigen, bevor du dich einloggen kannst (Art. 8 DSGVO).</div>
      </div>

      <div class="field">
        <label for="reg-parent">E-Mail eines Elternteils</label>
        <input class="input" type="email" id="reg-parent" name="parent_email" placeholder="elternteil@beispiel.de">
      </div>

      <a class="link" href="08-datenschutz-kinder.html">Was passiert mit meinen Daten? (kindgerecht erklärt)</a>

      <button class="btn btn-primary btn-block" type="button">Registrieren</button>
      <a class="link-muted" href="01-landing-und-app-vorschau.html">← Zurück zur Startseite</a>
    </div>
  </div>
</body>
</html>
