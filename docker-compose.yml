services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edukedo
      POSTGRES_PASSWORD: edukedo
      POSTGRES_DB: edukedo_kern
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edukedo -d edukedo_kern"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Eigene, physisch getrennte Datenbank für den Payment-Service (Architekturplanung Abschnitt 2/3/8) —
  # bewusst eigene Postgres-Instanz statt einer zweiten Datenbank auf demselben Server, konsistent
  # mit "niemals eine gemeinsame DB-Verbindung zwischen apps/api und apps/payment".
  postgres_payment:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edukedo
      POSTGRES_PASSWORD: edukedo
      POSTGRES_DB: edukedo_payment
    ports:
      - "5433:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edukedo -d edukedo_payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  postgres_payment_data:
