services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edukedo
      POSTGRES_PASSWORD: edukedo
      POSTGRES_DB: edukedo_kern
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edukedo -d edukedo_kern"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
