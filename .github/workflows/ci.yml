name: CI

on:
  pull_request:
  push:
    branches: [main, master]

# Review A5/INF-30: Standard-Token nur lesend, keine hängenden Läufe, ältere Läufe desselben Zweigs abbrechen.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Review A5/INF-05: Die Integrationstests von Kern und Payment nutzen eine Redis-Instanz unter localhost:6379
    # (BullMQ-Warteschlangen); Postgres starten sie selbst per Testcontainers.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Keine eigene Versionsangabe: pnpm/action-setup liest "packageManager" aus der package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate content
        run: pnpm --filter @edukedo/api db:validate-content

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Review A5/INF-01: Das gebaute Bündel muss ohne Quellbaum und ohne tsx starten. /health braucht weder Datenbank noch
      # externe Dienste; der Aufruf scheitert, wenn ein Import im Bündel fehlt.
      - name: Smoke test of the built API
        working-directory: apps/api
        env:
          NODE_ENV: production
          PORT: "3101"
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
          VAPID_PUBLIC_KEY: ci
          VAPID_PRIVATE_KEY: ci
          PAYMENT_SERVICE_TOKEN: ci-only-payment-token-0123456789
          CONTENT_DIR: ${{ github.workspace }}/content
        run: |
          node dist/validate-content.js
          node dist/index.js > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3101/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3101/health || { cat server.log; kill $pid; exit 1; }
          kill $pid

      - name: Smoke test of the built payment service
        working-directory: apps/payment
        env:
          NODE_ENV: production
          PORT: "3102"
          PAYMENT_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/ci
          KERN_SERVICE_TOKEN: ci-only-payment-token-0123456789
        run: |
          node dist/index.js > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3102/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3102/health || { cat server.log; kill $pid; exit 1; }
          kill $pid

  # Ende-zu-Ende-Tests (Playwright, apps/e2e): echter Browser gegen Vite-Entwicklungsserver, API, Postgres und Redis. Die Testdatenbank
  # und ihr fester Testkurs entstehen im Schritt "Prepare database" (siehe apps/e2e/README.md).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edukedo
          POSTGRES_PASSWORD: edukedo
          POSTGRES_DB: edukedo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edukedo -d edukedo_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm --filter @edukedo/e2e exec playwright install --with-deps chromium
      - name: Prepare database
        run: pnpm --filter @edukedo/e2e prepare-db
      - name: Run end-to-end tests
        run: pnpm --filter @edukedo/e2e e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7

  # Review A5: Die Images müssen sich bauen lassen (kein Push, kein Deployment).
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t edukedo-api:ci .
      - name: Build payment image
        run: docker build -f infra/docker/payment.Dockerfile -t edukedo-payment:ci .

  # Review A5/INF-06/INF-30: Bekannte Sicherheitsmeldungen in Produktionsabhängigkeiten lassen die CI fehlschlagen.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level=high
